name: Desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-dir: packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
            bundle-dir: |
              packages/desktop/src-tauri/target/release/bundle/deb
              packages/desktop/src-tauri/target/release/bundle/appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: packages/desktop/src-tauri
        run: cargo test

      - name: Build
        run: pnpm -F @als/desktop tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: active-local-servers-${{ runner.os }}
          path: ${{ matrix.bundle-dir }}
