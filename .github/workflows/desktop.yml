name: Desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: packages/desktop/src-tauri
        run: cargo test

      - name: Test release copy
        run: node --test scripts/copy-release.test.mjs

      - name: App version
        id: version
        run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('packages/desktop/src-tauri/tauri.conf.json','utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: node scripts/desktop-build.mjs ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: active-local-servers-${{ steps.version.outputs.version }}-${{ runner.os }}
          path: releases
          if-no-files-found: error
