[package]
name = "active-local-servers"
version = "0.1.0"
description = "Menubar app that lists local dev servers"
edition = "2021"

[lib]
name = "als_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
listeners = "0.6"
sysinfo = "0.39"
nix = { version = "0.31", features = ["signal", "user"] }
